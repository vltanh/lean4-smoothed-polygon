name = "SmoothedPolygons"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Basic", "External", "SmoothedPolygons", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

# Filippov's theorem and the Pontryagin maximum principle, from the published package at a pinned
# commit (it brings Brouwer's fixed-point theorem from the FixedPoint package).
[[require]]
name = "OptimalControl"
git = "https://github.com/vltanh/lean4-optimal-control"
rev = "88689a80ebc400f2e7b3656ee0b9d95a7bf42820"

[[lean_lib]]
name = "Basic"
globs = ["Basic.+"]

[[lean_lib]]
name = "External"
globs = ["External.+"]

[[lean_lib]]
name = "SmoothedPolygons"
globs = ["SmoothedPolygons.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
