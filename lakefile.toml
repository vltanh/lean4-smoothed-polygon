name = "SmoothedPolygons"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Basic", "External", "SmoothedPolygons", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

# Filippov's theorem and the Pontryagin maximum principle, from the published package at a pinned
# commit (it brings Brouwer's fixed-point theorem from the FixedPoint package).
[[require]]
name = "OptimalControl"
git = "https://github.com/vltanh/lean4-optimal-control"
rev = "d5a63ce39c9c8eb965d36698c859f6dfcc0e3032"

# The stable manifold theorem, from the published package at a pinned commit.
[[require]]
name = "StableManifold"
git = "https://github.com/vltanh/lean4-stable-manifold"
rev = "4909ed2eb6bdc504f86ccb455e544315f11d3860"

[[lean_lib]]
name = "Basic"
globs = ["Basic.+"]

[[lean_lib]]
name = "External"
globs = ["External.+"]

[[lean_lib]]
name = "SmoothedPolygons"
globs = ["SmoothedPolygons.+"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
