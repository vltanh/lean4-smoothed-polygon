    formalization proves by the same Taylor expansion, the sufficient direction, that the
    maximizer is optimal on some [0, eps]); Lemma 13.3.2 (E65: the book's two cases assume the
    maximizing face constant on the whole interval; if z3(t0) != 0, z3 stays on one open ray of
    the walls near t0, where the book's second case runs with RR(z3, ic) in place of
    RR(z3, zeta - zeta^2) and gives a contradiction, so z3 = 0 and the first case applies); Lemma
    13.5.2 (E67: its step 3 uses the maximum condition at t = t_sw for the outgoing control u and
    the incoming control zeta1 u, which by (13.5.2) and equivariance is the book's condition at
    t = 0, excludes zeta1 = 1 because the control switches at t_sw, and derives the three cases
    (r, zeta1) by exact identities; the two solutions are identified with (13.5.1) through the
    fixed-point equation; and the facts the book leaves out are proved by explicit cubic
    identities: the first control of q_out is zeta, shown from the definition, t_sw is the first
    switching time, and H_F = 0 there); and Lemma 13.5.5 (E68: the book's Mathematica eigenvalue
    computation is replaced by an exact Jacobian in the chart Re z1 = -1, z3 < 0, H_F = 0, with
    entries in Q(sqrt 3, r_scale), a certificate that the roots of its characteristic polynomial
    lie in (-0.1, 0.1), linearized stability for maps, and time reversal, tau o F_ang being an
    involution near q_out and q_in). In Chapters 15 and 16: the involution of Section 15.3 (E73:
    F^-1 = tau F tau, which the book uses on the closed cells, proved exactly at switching points
    and branch-wise for the root-based maps, and applied only at images of the map, which are
    switching points); the map F_A on the part C2^A of the top face of the second cell (E74: at a
    double root of chi_{A,0}, a tangency, the dynamics does not switch, so F_A is the continuous
    extension of the Poincare map, not the map itself; the bound t1 <= t_B, which the book does not
    argue, is proved); Remark 15.3.1 (E75: the labels swapped back, the coordinates and the
    crossings of the boundary loci certified in exact rational arithmetic); Theorem 16.1.1 (E77-E79:
    the containments of Table 16.1, which the book computes by a boundary method that needs
    injectivity, invariance of domain and the images of curved faces, none of them established,
    are replaced by three named facts about whole boxes, which avoid the curved parts and
    Proposition 15.3.2; the convergence in D_out, which containment and local stability do not
    give, uses a contraction and Banach's fixed point theorem, with F^-1(q_in) = {q_in} proved for
    the points that are not switching points; and the book's exclusion argument for the last row
    of the table, which uses D0 in D_in, impossible as written, and the injectivity of a
    multi-valued map, is replaced by whole-box subclaims with the target "the second cell or a
    smaller box", a descent on the box indices, and a re-entry step by time reversal); and Theorem
    16.2.1 (E80: the continuity of the radial factor at q_out proved in the chart of Lemma 13.5.5,
    and the vanishing of the Hamiltonian along a trajectory tending to the singular locus derived).
    Every other proof follows the book's argument; the remaining
    gaps are filled along the book's lines (among them those of Lemma 3.1.8, of the sketch of
    Theorem 7.7.1, whose "direct calculation" of hyperbolicity is supplied in closed form, and of
    Chapter 5: the compactness of the compactified star domain, the second claim of Lemma 5.0.3,
    Lemma 5.0.7 (4), the re-centering and the one-variable bound in the proof of Theorem 5.0.2, and
    the reparameterization of Section 3.5; and of Chapter 8: Lemma 8.2.1, the vanishing of the
    Hamiltonian at single times, the converse of Theorem 8.2.6, the second variation of Theorem
    8.2.7, whose exact cost formula has the book's expansion as its second-order truncation, with
    the condition on psi read on the interior of the overlap of the supports, claim (b) of
    Theorem 8.3.1, and Corollary A.1.3; and of Chapter 13: the constancy of the Hamiltonian along
    extremals with measurable controls and the uniqueness of extremals up to the first switching
    time, which the book asserts, E62, the well-definedness of the Poincare map, E67, and the facts
    about r_scale, by sign changes of the palindromic polynomial at rational points; and of
    Chapter 15: the continuity of the first switching time and of the cell maps, which the book
    asserts, E70, by the continuity of a least positive sign change, and the vanishing limiting
    switching time on the faces of Figure 15.1, E72, by semicontinuity), and the index slips of Lemmas 2.4.5 and 5.0.7 (3) are corrected. In Lemma 8.1.5 and Theorem 8.3.1 the
    estimates use l1 norms, and in Lemma 8.3.4 Taylor expansions with remainder replace the
    analyticity of the solutions (inessential).
    Remarks 6.6.1, 7.5.2, 7.6.4 and 8.3.3 have no proof in the book, nor have the converse of
    Problem 3.6.2 for winding number one (which generalizes the formalization's argument for the
    smoothed polygons), the bound cost >= (3/2) x (angle swept by g s_0*) on trajectories of higher
    winding (a new pointwise argument), and the identification of the minimizers with K_min (which
    assembles the results of Chapters 2-3). Proofs of the cited results follow their sources, except where a source quotes
    another paper without proof (Mahler 1947's Lemma 5 and footnote 8, used in its Theorem 2) and in Fejes Toth's theorem (Dowker's theorem by an alternating merge; the cell lemma by
    Boroczky's maximal cells, with a counting argument and angle sums in place of boundary cycles
    and Euler's formula). Lemma 3 of Mahler 1947, stated there without proof, follows Mahler's
    paper A and Mahler 1946 throughout, with their errors and gaps repaired (among them a function
    in Mahler 1946's proof of Theorem C that is not even and so defines no star body, and Lemma 12
    of paper A, which does not follow from the two theorems it is quoted from without paper A's
    own Corollary to Lemma 5 and Lemma 1); the departures that remain are small: the minimal
    determinant of a parallelogram is taken from Mahler's own example instead of Minkowski's
    theorem on linear forms, and the two results of Mahler's Part I that the 1946 paper quotes
    (selection, existence of critical lattices) are proved in the plane by standard arguments.
    The domains are symmetric convex domains in the plane, with their gauge as distance function,
    and irreducibility is tested against symmetric convex subdomains (paper A's Lemma 13 is the
    bridge to Mahler's star domains). Filippov's theorem is proved by the standard argument (equi-Lipschitz
    trajectories, a limit by Tychonoff's theorem, measurable selection), not compared with its
    source's. The maximum principle (in the OptimalControl package) follows Agrachev and Sachkov's
    Chapter 12, with the departures D1-D11 listed in the package's README: in coordinates on an
    open subset of a finite-dimensional space, the chronological calculus read pointwise along
    trajectories; C1 instead of smooth, strong local instead of global minimizers (both
    generalizations); a compact control set; free time with a cost and mixed boundary conditions,
    left to the reader, through one auxiliary system; measurable time changes (the source's
    reparametrization assumes a smooth new time); Lemma 12.1 on any convex cone; one supporting
    covector for all needle variations (the source's proof of Theorem 12.4 takes one for each);
    Brouwer's theorem from the FixedPoint package; and the well-posedness of Caratheodory
    solutions, which the source cites from Gamkrelidze, proved by Picard iteration and Gronwall's
    inequality, with a cut-off near the reference trajectory instead of complete vector fields.
    Three gaps of the source are repaired: the proof of Remark (1) after Lemma 12.1 (any convex
    cone) uses interior points, which a cone may lack; a needle variation placed at the final time
    t1 varies nothing (such times are moved); and the Lipschitz property and derivative of the
    end-point map of the needle variations (p. 172) are stated without proof.

review:
  status: "agent-reviewed"
  reviewers:
    - "none (no human review of the proofs)"
  notes: >-
    The statements were reviewed against the book's TeX source by an independent agent before
    the proofs were written; the proofs were compared with the book's by two further agents; the
    findings of REPORT.md and its sections on the literature were checked against the TeX source
    and the cited works by independent agents. In the fourth round an independent agent reviewed
    the new statements before the proofs, and another compared the proof of the maximum principle
    with Agrachev and Sachkov's and confirmed the gaps it repairs. In the fifth round an
    independent agent reviewed the new statements before the proofs, and another compared the
    formalization with the book's Chapter 5 and Section 6.1 and checked the gaps and errors
    reported. In the sixth round an independent agent reviewed the new statements before the
    proofs, the counterexamples to Theorem 8.3.1 as printed were checked independently, and another
    agent compared the formalization with the book's Chapter 8 and the proof of Theorem 16.3.1 and
    checked the gaps and errors reported. In the seventh round an independent agent reviewed the
    Chapter 13 statements before the proofs, and another compared the formalization with the
    book's Chapter 13 and checked the gaps and errors reported. In the eighth round an independent
    agent reviewed the Chapter 15 and Section 16.1-16.2 statements before the proofs, another
    checked the three numerical facts of Theorem 16.1.1 in its own multiple-precision
    implementation (about 1.1 million evaluations, no violation), and another compared the
    formalization with the book's Chapter 15 and Sections 16.1-16.2 and checked the gaps and errors
    reported. No person has reviewed the proofs.

alignment:
  namespace: "SmoothedPolygonsChallenge"
  statements:
    - source: "Theorem 7.5.6 (thm:6k+2)"
      lean: "SmoothedPolygonsChallenge.smoothed_polygon_extremal"
      module: "Challenge"
      status: "proved"
      note: >-
        For every k >= 1, the state trajectory with the control e3, e1, e2, ... on 3k+1 switching
        intervals of length t_sw from g(0) = I2, X(0) = Phi(i y0) exists, and every such trajectory
        is bang-bang and lifts to a Pontryagin extremal (IsPontryaginExtremal, the conditions of
        the maximum principle with the corrected transversality condition X(t_f) = R^-1 X(0) R,
        E16, and the nontriviality condition on the reduced costate, E21).
    - source: "Example before Theorem 7.5.6 (the smoothed octagon)"
      lean: "SmoothedPolygonsChallenge.smoothed_octagon_density"
      module: "Challenge"
      status: "proved"
      note: >-
        For k = 1: y0 = sqrt((sqrt 8 - 1)/3), t_sw = ln 2/(2 sqrt(sqrt 8 - 1)), and the cost of every
        such trajectory is sqrt(12)(8 - sqrt 32 - ln 2)/(sqrt 8 - 1) < pi, so cost/sqrt(12) is
        Reinhardt's density; the trajectory bounds a balanced disk K in circle representation whose
        area is that cost and whose greatest packing density (Definition 2.1.1, Euclidean disks,
        congruent copies) is (8 - sqrt 32 - ln 2)/(sqrt 8 - 1). The book uses this density without
        proving that balanced disks have least circumscribed hexagon of area sqrt(12) (REPORT.md,
        E12); the formalization proves it.

