# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Smoothed polygons in the Reinhardt optimal control problem"
  description: >-
    A Lean 4 formalization of the smoothed-polygon core of Thomas Hales and Koundinya Vajjha,
    Packings of Smoothed Polygons (arXiv:2405.04331v1, 2024), with its geometric foundations. The
    book reformulates the Reinhardt problem, which asks for the centrally symmetric convex disk
    whose densest packing is least dense, as an optimal control problem on SL2(R), and studies its
    Pontryagin extremals.


    The formalization covers Chapters 2, 3, 4, 6 and 7 of the book with Appendices A.6 and A.11:
    packing and lattice packing densities, critical lattices and circumscribed hexagons, the
    boundary of the minimizer and balanced disks, the state dynamics, the cost and its area
    formula, the upper half-plane model, Filippov's existence theorem, left-invariant control
    systems, the Hamiltonian and the costate equations, constant and bang-bang controls. Its main
    results are Theorem 7.5.6, that for every k >= 1 the smoothed (6k+2)-gon is a Pontryagin
    extremal of the Reinhardt control problem with bang-bang control; that the smoothed octagon is
    a balanced disk of area sqrt(12)(8 - sqrt(32) - ln 2)/(sqrt(8) - 1) whose greatest packing
    density is (8 - sqrt(32) - ln 2)/(sqrt(8) - 1); and Theorem 7.7.1, that the smoothed octagon is
    an isolated extremal, whose proof the book only sketches. The cited results the proofs use are
    proved, among them Fejes Toth's theorem that lattice packings are densest for centrally
    symmetric disks and Mahler's theorems on critical lattices, and so is Filippov's theorem. Four
    results of the book are false as printed and are proved in corrected form: Lemma 2.2.1
    (refuted in Lean), Lemma 3.1.8 and Filippov's theorem (each missing a hypothesis), and Theorem
    7.7.1 (true up to time translation, for terminal times near t_f).


    A fourth round, the first layer of a plan for the book's remaining chapters, proves the claim
    of Section 6.2 that every minimizer of the Reinhardt control problem lifts to a Pontryagin
    extremal, along the book's route, through the Pontryagin maximum principle (free terminal time,
    integral cost, mixed boundary conditions), which the book cites from Agrachev and Sachkov and
    which the package OptimalControl proves by their argument, with Brouwer's fixed-point theorem
    from the package FixedPoint; and Remark 6.6.1, that every extremal extends to a periodic one.
    The existence of a minimizer (Chapter 5) and the book's main theorem (Mahler's First
    conjecture) are not formalized.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.OC", "math.MG"]
  msc2020: ["52C15", "52A10", "49K15"]

sources:
  - title: "Packings of Smoothed Polygons"
    authors:
      - "Thomas Hales"
      - "Koundinya Vajjha"
    id: "arXiv:2405.04331v1"
    type: "book (preprint)"
    location: "https://arxiv.org/abs/2405.04331v1"
    relationship: "formalizes"
    license: "arXiv.org perpetual, non-exclusive license to distribute 1.0"
    author_endorsement: "not-contacted"
  - title: "The Reinhardt Conjecture as an Optimal Control Problem"
    authors:
      - "Thomas C. Hales"
    id: "arXiv:1703.01352"
    type: "preprint"
    location: "https://arxiv.org/abs/1703.01352"
    relationship: "background"
    note: >-
      Earlier preprint that introduced the control-theoretic reformulation and announced that the
      smoothed (6k+2)-gons are Pontryagin extremals with bang-bang control; the book gives the
      full account formalized here.
    author_endorsement: "not-contacted"
  - title: "Über die dichteste gitterförmige Lagerung kongruenter Bereiche in der Ebene und eine besondere Art konvexer Kurven"
    authors:
      - "Karl Reinhardt"
    id: "doi:10.1007/BF02940676"
    type: "article"
    location: "Abh. Math. Sem. Univ. Hamburg 10 (1934) 216-230"
    relationship: "background"
    note: "The smoothed octagon and the Reinhardt problem; not used in the formal proofs."
  - title: "Global aspects of classical integrable systems"
    authors:
      - "Richard H. Cushman"
      - "Larry M. Bates"
    type: "book"
    location: "Birkhäuser, 1997"
    relationship: "background"
    note: >-
      Source of the Euler-Arnold equation cited in the proof of Proposition 6.5.1, proved in the
      formalization for left-invariant Hamiltonians on matrix groups (External.euler_arnold).
  - title: "Control Theory from the Geometric Viewpoint"
    authors:
      - "Andrei A. Agrachev"
      - "Yuri L. Sachkov"
    type: "book"
    location: "Encyclopaedia of Mathematical Sciences 87, Springer, 2004, Theorem 10.1 and Chapter 12"
    relationship: "background"
    note: >-
      The book's reference for the maximum principle (bibliography entry zelikin2004control, which
      names M. I. Zelikin as first author). The maximum principle with free terminal time, an
      integral cost and mixed boundary conditions (Theorem 12.5 with the remark after it) is
      stated in External.pontryagin_maximum_principle and proved in the OptimalControl package by
      Agrachev and Sachkov's argument (Chapter 12, read in the authors' draft with preface dated
      September 2003, from the first author's home page), with the departures D1-D11 that the
      package's README lists; three gaps of the proof are repaired (REPORT.md, Section 7).
      Filippov's theorem, stated in the book as Theorem 6.1.1 without a source and cited from this
      book (Theorem 10.1) by Hales's 2017 preprint, is proved on R^n (External.filippov) by the
      standard argument, written before Agrachev and Sachkov's text was available to us and not
      compared with it.
  - title: "Analytic proofs of the \"hairy ball theorem\" and the Brouwer fixed point theorem"
    authors:
      - "John Milnor"
    type: "article"
    location: "Amer. Math. Monthly 85 (1978) 521-524"
    relationship: "background"
    note: >-
      Not cited by the book. Brouwer's fixed-point theorem, which Agrachev and Sachkov's proof of
      the maximum principle uses without reference, is proved in the FixedPoint package by the
      analytic argument that this paper and the next are known for; their full texts were not
      available, and the proof was not compared with them line by line.
  - title: "A less strange version of Milnor's proof of Brouwer's fixed-point theorem"
    authors:
      - "C. A. Rogers"
    type: "article"
    location: "Amer. Math. Monthly 87 (1980) 525-527"
    relationship: "background"
    note: "Not cited by the book; see the previous entry."

  - title: "Some packing and covering theorems"
    authors:
      - "László Fejes Tóth"
    type: "article"
    location: "Acta Sci. Math. (Szeged) 12A (1950) 62-67"
    relationship: "background"
    note: >-
      Cited as Theorem 2.1.3 (delta = delta_L for centrally symmetric disks); proved in the
      formalization (External.fejes_toth), through Dowker's theorem and Boroczky's cell lemma.
  - title: "Finite packing and covering"
    authors:
      - "Károly Böröczky Jr."
    type: "book"
    location: "Cambridge University Press, 2004 (and Discrete Comput. Geom. 30 (2003), Lemma 5)"
    relationship: "background"
    note: "Source of the cell lemma used in the proof of Fejes Toth's theorem; not cited by the book."
  - title: "Convex and Discrete Geometry"
    authors:
      - "Peter M. Gruber"
    type: "book"
    location: "Springer, 2007, Corollary 30.1"
    relationship: "background"
    note: "Cited in Definition 2.1.2 (density of a lattice packing); proved (External.gruber_corollary_30_1)."
  - title: "On the minimum determinant and the circumscribed hexagons of a convex domain"
    authors:
      - "Kurt Mahler"
    type: "article"
    location: "Proc. KNAW 50 (1947) 692-703"
    relationship: "background"
    note: >-
      Cited as Theorems 2.3.6 and 2.3.7 and after Definition 2.3.5; Lemma 2 (with Minkowski),
      Theorems 1 and 2 and Lemma 3 are proved (External.minkowski_mahler, External.mahler_1947,
      External.mahler_irreducible_iff, and External.mahler_irreducible, the form Lemma 2.2.5 uses).
      Lemma 3 is stated there without proof; it is proved along the next two sources.
  - title: "On irreducible convex domains"
    authors:
      - "Kurt Mahler"
    type: "article"
    location: "Proc. KNAW 50 (1947) 98-107"
    relationship: "background"
    note: >-
      Not cited by the book; the paper ("paper A") to which Mahler 1947 refers for the proof of
      Lemma 3, read from a scan of Mahler's collected works (CARMA archive, item 094). Its Lemmas 1,
      2, 5-7 and 13 are proved by its arguments (External/MahlerIrreducible.lean,
      External.MahlerIrreducible.ml3_onlyIf), and the Corollary to Lemma 5, which it states without
      proof, is proved; its errors and gaps are repaired (REPORT.md, Section 7).
  - title: "Lattice points in n-dimensional star bodies II. Reducibility theorems I"
    authors:
      - "Kurt Mahler"
    type: "article"
    location: "Proc. KNAW 49 (1946) 331-343"
    relationship: "background"
    note: >-
      The book's entry mahler1946lattice, cited with Minkowski for Theorem 2.3.6, of which it only
      quotes the six-point statement (REPORT.md, E33). Paper A quotes its Lemmas 8, 10, 11 and 12
      from Theorems B-E of this paper, which are proved in the plane by Mahler's arguments
      (External/Mahler1946/TheoremC.lean, External/Mahler1946/TheoremE.lean; scan of Mahler's
      collected works, CARMA archive, item 088), with its errors and gaps repaired: the function G
      in the proof of Theorem C is not even, so it does not define a star body (proved in Lean),
      and two steps of Section 4 are asserted without argument.

related_formalizations:
  - id: "https://github.com/sunfishho/reinhardt-density-bound"
    relationship: "independent"
    note: >-
      Independent, unreviewed Lean 4 development (created 2 November 2026) claiming a lower bound
      for the least packing density and formalizing parts of the book's Chapters 2, 3 and 5. It
      does not formalize Theorem 7.5.6. This work did not consult or use it.
  - id: "https://github.com/vltanh/lean4-optimal-control"
    relationship: "builds-on"
    note: >-
      The package OptimalControl, by the same maintainer, required at the commit pinned in
      lake-manifest.json: control systems with Caratheodory trajectories, Filippov's theorem,
      measurable selection, and the Pontryagin maximum principle proved by Agrachev and Sachkov's
      argument. External/Filippov.lean and External/Pontryagin.lean state the cited results in the
      book's terms and prove them from it. The Challenge does not import it.
  - id: "https://github.com/vltanh/lean4-fixed-point"
    relationship: "builds-on"
    note: >-
      The package FixedPoint, by the same maintainer, required by OptimalControl: Brouwer's
      fixed-point theorem, by Milnor and Rogers' analytic argument, used in the proof of the
      maximum principle.
  - id: "https://github.com/willcforte/pontryagin-lean"
    relationship: "independent"
    note: >-
      An earlier Lean attempt at the Pontryagin maximum principle (13 May 2026), which states its
      key steps as axioms. This work does not use it.

status:
  scope: >-
    Formalized: every numbered result of Chapters 2, 3, 4, 6 and 7 of the book and of Appendices
    A.6 and A.11, including Theorem 6.1.1 (Filippov, cited without a source), Definition 6.3.1 and
    Proposition 6.4.1 (left-invariant systems on Lie groups) and Theorem 7.7.1 (the smoothed
    octagon is an isolated extremal; the book gives a proof sketch), and Remarks 2.2.4, 7.5.2 and
    7.6.4, the remark after Definition 2.3.5 and the action of the dihedral group on the ideal
    vertices of Section 4.6. Lemma 2.2.1 is false as printed (refuted in Lean) and is proved in
    corrected form (REPORT.md, E1); Theorem 7.7.1 is false read literally and is proved up to time
    translation, for terminal times near t_f (E32); Lemma 3.1.8 and the existence claim of Theorem
    6.1.1 are proved with a missing hypothesis added (E34, E35); the user approved the four
    corrected statements. Also proved (fourth round, the first layer of a plan for Chapters 5 and
    8-16): the claim of Sections 6.2 and 6.6, used in Proposition 8.1.3, that every global
    minimizer of the Reinhardt control problem lifts to a Pontryagin extremal
    (SmoothedPolygons.exists_isPontryaginExtremal_of_isReinhardtMinimizer), with the boundary
    conditions written without two equations made redundant by first integrals (E21), and Remark
    6.6.1, stated in the book without proof (E38). Not formalized: Chapters 1, 5 and 8-16, including
    the main theorem (Mahler's First conjecture, Theorem 16.3.1); Appendices A.1-A.5, A.7-A.10 and
    B; within the formalized chapters, the conjectural Remarks 7.6.1 and 7.6.3 and the application
    of Filippov's theorem in Section 6.1, which rests on Chapter 5 and gives the existence of a
    minimizer (the next layer). Pontryagin extremals are defined by the conditions of the maximum
    principle (IsPontryaginExtremal), and the maximum principle shows that minimizers are
    extremals. No cited theorem is assumed: Fejes Toth's theorem, Gruber's density formula, the
    theorems of Minkowski and Mahler on critical lattices and circumscribed hexagons, Mahler's
    Lemma 3 on irreducible domains (in full, along the two earlier papers of Mahler on which it
    rests), the Euler-Arnold equation and the Pontryagin maximum principle are proved, and so is
    Filippov's theorem; the last two are stated in External/ and proved in the OptimalControl
    package (github.com/vltanh/lean4-optimal-control, at a pinned commit), which takes Brouwer's
    fixed-point theorem from the FixedPoint package (github.com/vltanh/lean4-fixed-point).
    Statements and definitions corrected (REPORT.md, Section 3): E1 (false lemma), E6, E13 (a
    hypothesis approved by the user), E16, E17, E20, E21, E26, E32 (Theorem 7.7.1's reading), E34
    and E35 (hypotheses approved by the user).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code 2.1.318 (VS Code extension, Claude Agent SDK)"
      tool_setup: >-
        The formalize-math-paper skill (https://github.com/vltanh/formalize-math-paper, local copy
        dated 2026-10-17, and versions 3.0.1 to 3.2.5 of its repository in the fourth round) in one
        Claude Code session, in four rounds, with 97 sub-agents of the same model on the
        formalization and its two packages (at most 9 at once): statement reviews against the TeX
        source and the cited sources, parallel proofs by chapter and by part, proof reviews,
        verification of the audit and of its literature section, and an exploration of follow-up
        directions; 11 more sub-agents evaluated revisions of the skill. Lean builds, the axiom
        audit, a route check of every proof against the results the book's proof cites, and
        Comparator were run locally.
      cost:
        wall_time: >-
          48.6 hours elapsed from the start to the completed audit report of the fourth round
          (5-7 November 2026, including two nights and about 15 hours stopped by a usage limit);
          the rounds took 3.2, 15.5, 21.5 and 5.6 hours; 47.4 hours of sub-agent working time in
          all (0.6 of them evaluating the skill)
        spend_usd: "not tracked"
        hardware: "local machine (Linux) for Lean builds; models via API"
      prompting_notes: >-
        One request: '/formalize-math-paper https://arxiv.org/abs/2405.04331'. The user chose the
        scope of each round and decided the questions the work raised: the proof of Jacobi's formula
        and the hypothesis of Theorem 3.1.4(3) (first round); proving every cited theorem, the
        routes for Lemmas 2.2.1 and 2.2.5, and the corrected form of Lemma 2.2.1 (second round);
        the hypothesis of Lemma 3.1.8, the statement of Filippov's theorem, the reading of
        Theorem 7.7.1, and following Mahler's 1946 paper for his Lemma 3 (third round); a layered
        plan for Chapters 5 and 8-16, beginning with the maximum principle; proving it by Agrachev
        and Sachkov's argument, with our own proof of Brouwer's fixed-point theorem, in a separate
        public package, rather than one taken from another development; the general control theory
        in a separate public package; the book's route for the Reinhardt instance (the costate
        equations through Proposition 6.5.1, with non-redundant boundary conditions); and the
        book's route through Chapter 5 for the existence of a minimizer, the next layer (fourth
        round).
  spend_usd: "not tracked"
  notes: >-
    The-Anh Vu-Le requested the formalization, chose its scope in four rounds (first the
    control-theoretic core, then Chapter 2 with every cited theorem proved, then the rest of the
    formalized chapters, then the first layer of a plan for Chapters 5 and 8-16: the maximum
    principle and the lift of every minimizer to an extremal) and made the decisions it needed
    (the proof of Jacobi's formula, the hypothesis of Theorem 3.1.4(3), the routes for Lemmas
    2.2.1 and 2.2.5 and for Mahler's Lemma 3 (along Mahler's 1946 paper), the corrected form of
    the false Lemma 2.2.1, the hypothesis of Lemma 3.1.8, the statement of Filippov's theorem, the
    reading of Theorem 7.7.1; in the fourth round the layered plan, proving the maximum principle
    by Agrachev and Sachkov's argument with our own Brouwer's theorem in a separate public
    package, and the book's route for the Reinhardt instance). Claude Opus 5.5 wrote the
    statements, the proofs, the two packages, the audit report and the packaging; independent
    agents reviewed the statements, the proofs and the report. No person has reviewed the proofs.
    Details and token counts in CREDITS.md.

fidelity:
  divergences: >-
    Corrections of statements (REPORT.md, Sections 3 and 4): E1, Lemma 2.2.1 is false as printed
    (a lattice packing need not be a tiling by a hexagon containing the disk; counterexample
    L = Z^2, K = {|2y0 + y1| <= 1, |2y1 - y0| <= 1}, refuted in Lean) and is proved in its
    classical packing form, which is all Theorem 2.2.2 uses (approved by the user); E6, a critical
    lattice is required to be admissible, as in the sources; E13, Theorem 3.1.4(3) is false for a
    general convex disk and is proved under the hypothesis that the tangents are Lipschitz (the
    standing assumption of the book's Section 2.4; approved by the user); E16, the terminal
    condition of Problem 3.6.2 is R^-1 X(0) R (misprint R X(0) R^-1); E17, Lemma 4.2.3 needs X != 0;
    E20, the sign of a(u) in Problem 4.5.1; E21, the nontriviality condition of a Pontryagin
    extremal is imposed on the reduced costate (lambda_cost, Lambda_1, Lambda_R), since on the full
    costate (Lambda_1, Lambda_2) of Section 6.2 every admissible trajectory would lift, and, in the
    proof that minimizers are extremals, the maximum principle is applied with the boundary
    conditions g(0) = I2, g(t_f) = R, X(t_f) = R^-1 X(0) R less the two equations that the first
    integrals det g and det X make redundant, for with them its conclusions hold for every
    admissible trajectory with a covector whose reduced costate vanishes; E26, Lemma
    7.3.1 needs <X, Z_u> != 0 on the control set; E32, Theorem 7.7.1 (the smoothed octagon is an
    isolated extremal) is false read literally (the octagon's lift started at another time, or run
    for several laps, is another extremal with all the transversality conditions and a nearby or
    the same initial condition) and is proved up to time translation, for terminal times near t_f,
    in a conic neighbourhood of the normalized initial condition (approved by the user); E34,
    Lemma 3.1.8 is false unless the curves of the multi-curve are regular (a square, with one curve
    at rest and two sliding along parallel edges), as the book's Section 2.4 assumes, and is proved
    with that hypothesis (approved by the user); E35, Filippov's theorem (Theorem 6.1.1, stated
    without a source) asserts that an optimal control exists when the velocity sets f(q, U) are
    convex, which fails for costs depending on the control, and is proved when the velocity sets
    extended by the cost are convex, the book's hypothesis for the Reinhardt cost (approved by the
    user). Slips in proofs corrected where they occur: E8, E14, E24.


    Redundant hypotheses omitted from the Lean statements (REPORT.md, Section 5): Theorem 3.1.4
    (1)-(2), Proposition 3.1.9, Corollary 3.1.10, Lemma 3.3.1, Corollary 6.5.4, Theorem 6.8.2,
    Lemma 7.1.2, Lemma 7.3.1, and the packing hypothesis of Gruber's Cor. 30.1. The Challenge keeps
    the book's hypotheses. Kept although the proofs do not use them, because the book or the source
    states them: the covering hypothesis of Lemma 3.1.8, the properties of the bilinear form in
    Proposition 6.4.1, and the smoothness of f in q in Filippov's theorem.


    Readings (REPORT.md, Section 6): the book's disks B_r are Euclidean disks, congruent copies
    include reflections, densities are taken in [0, infinity] and exist when finite and equal;
    lattices are discrete Z-submodules spanning R^2 with determinant the covolume; least-area
    circumscribed hexagons are compared among strictly convex hexagons centred at the origin; Lemma
    2.2.7 is formalized with polar-angle lifts, Lemma 2.4.2 literally, Lemmas 2.4.5-2.4.6 with the
    positive orientation of Section 2.4; the area formula of Section 3.2 assumes the book's
    normalization sigma_j(t + t_f) = sigma_{j+1}(t); matrix-valued curves are differentiated and
    called Lipschitz entry by entry; differential equations with measurable controls are solved in
    Caratheodory's sense; Pontryagin extremals are defined by the conditions of the maximum
    principle in the reduced costate variables; Proposition 6.5.1 takes Hamilton's equations in
    canonical coordinates (g, p) of the cotangent bundle of GL2, with Lambda_1 = p g, as hypotheses;
    a bang-bang control takes values in the vertices of the control simplex; Lemma 6.8.1 is stated
    for nonzero traceless X; Theorem 6.8.3 is proved in the direction of its statement; Proposition
    3.6.1 is stated without smoothness of the trivialization; Lemma 3.1.8 reads "the boundary is
    parametrized by a C1 multi-curve" as in Section 2.4 (regular curves whose arcs cover the
    boundary) and measures areas by the signed shoelace area; Filippov's theorem is stated on R^n
    instead of a manifold, with Caratheodory trajectories, for fixed and free terminal time;
    Definition 6.3.1 and Proposition 6.4.1 are stated on Mathlib's real Lie groups, with the left
    trivialization of the cotangent bundle part of the statement; the ideal vertices of Section 4.6
    are points of Mathlib's OnePoint R, acted on by GL2(R); Remark 7.5.2's "monotonic increasing"
    is strict; Remark 7.6.4's "when k = 1" is the limit k -> 1+ of the (6k-2)-gons interpolated to
    real k (cost tending to sqrt(12), arcs tending in the Hausdorff distance to the boundary of a
    rectangle of area sqrt(12)); Theorem 7.7.1 is read as in E32. The maximum principle of Section
    6.2 is stated on an open subset of a finite-dimensional space, with a compact control set (the
    book's "closed"), dynamics C1 in the state with jointly continuous state derivative (the book's
    "smooth", with Agrachev and Sachkov's (10.4), which its summary omits), strong local
    minimizers, free terminal time, an integral cost and mixed boundary conditions; it is applied
    on the open set GL2+(R) x C of Mat2(R) x sl2(R), C the open cone of the star inequalities,
    with g(0) = I2 and det X(0) = 1 among the boundary conditions, instead of the book's manifold
    SL2(R) x sl2(R) (a departure, below);
    Hamilton's equations, which the book writes for the maximized Hamiltonian, are the adjoint
    equation of the control-dependent Hamiltonian at the optimal control (as in Agrachev and
    Sachkov), in integral form; "the Hamiltonian vanishes identically" is read almost everywhere;
    the book's separated transversality conditions (initial and terminal manifolds) are replaced by
    the mixed form for the coupled boundary condition X(t_f) = R^-1 X(0) R; the costates are
    Lambda_1 = p g made traceless and Lambda_R = [Lambda_2, X], for the covector p of the maximum
    principle; Propositions 3.6.1 and 6.4.1, stated on Mathlib's Lie groups, are checked in matrix
    coordinates for this application (Mathlib does not identify the bracket of left-invariant
    vector fields on the units of Mat2(R) with the commutator); Remark 6.6.1's "transversal
    trajectory" is a Pontryagin extremal, extended with the control rotated from one period to the
    next.


    Departures from the book's proofs (REPORT.md, Section 7), each forced by an error or gap of the
    book or by mathematics Mathlib lacks: Lemma 2.2.1 (its printed form is false; the corrected
    form is proved through maximal lattice-packed symmetric bodies); Lemma 2.2.5
    (the book's shaving argument cannot rule out corners at endpoints of flat boundary segments;
    closed by Mahler's lattice route, chosen by the user); one step each of Lemma 2.4.2 (the
    integral curve is not shown to stay on the boundary) and Lemma 2.4.6 (Shifrin's Proposition 3.8 is about smooth curves; a direct argument); the area
    formula of Section 3.2 (Green's theorem replaced by its polar-coordinates form for star-shaped
    regions); Lemma 3.1.12 (Jacobi's formula by the Leibniz expansion, approved by the user); Lemma
    4.3.1 (comparison with the smoothed octagon); the application of the maximum principle in
    Section 6.2 (on the open set GL2+(R) x C instead of the manifold SL2(R) x sl2(R), since the
    principle available in Lean is stated on open subsets of a finite-dimensional space; with the
    boundary conditions without the two equations made redundant by first integrals, E21; and
    with an argument the book does not give for the nontriviality of the reduced costate:
    Corollary 6.5.3, uniqueness for the linear Lambda_R equation, transversality at t_f); one step
    of Theorem 7.7.1 (the fixed points of the fourth iterate of the Poincare map near the octagon's: the book applies the implicit function
    theorem for each value of the parameter d = det Lambda_1 separately, which does not give the
    neighbourhoods uniform in d that its conclusion needs; the formal proof applies the inverse
    function theorem once, at the octagon's fixed point, to the map (section constraints, f^4 - id),
    whose constraints include d). Every other proof follows the book's argument; the remaining gaps
    are filled along the book's lines (among them those of Lemma 3.1.8 and of the sketch of Theorem
    7.7.1, whose "direct calculation" of hyperbolicity is supplied in closed form), and the index
    slip of Lemma 2.4.5 is corrected. Remarks 6.6.1, 7.5.2 and 7.6.4 have no proof in the book. Proofs of the cited results follow their sources, except where a source quotes
    another paper without proof (Mahler 1947's Lemma 5 and footnote 8, used in its Theorem 2) and in Fejes Toth's theorem (Dowker's theorem by an alternating merge; the cell lemma by
    Boroczky's maximal cells, with a counting argument and angle sums in place of boundary cycles
    and Euler's formula). Lemma 3 of Mahler 1947, stated there without proof, follows Mahler's
    paper A and Mahler 1946 throughout, with their errors and gaps repaired (among them a function
    in Mahler 1946's proof of Theorem C that is not even and so defines no star body, and Lemma 12
    of paper A, which does not follow from the two theorems it is quoted from without paper A's
    own Corollary to Lemma 5 and Lemma 1); the departures that remain are small: the minimal
    determinant of a parallelogram is taken from Mahler's own example instead of Minkowski's
    theorem on linear forms, and the two results of Mahler's Part I that the 1946 paper quotes
    (selection, existence of critical lattices) are proved in the plane by standard arguments.
    The domains are symmetric convex domains in the plane, with their gauge as distance function,
    and irreducibility is tested against symmetric convex subdomains (paper A's Lemma 13 is the
    bridge to Mahler's star domains). Filippov's theorem is proved by the standard argument (equi-Lipschitz
    trajectories, a limit by Tychonoff's theorem, measurable selection), not compared with its
    source's. The maximum principle (in the OptimalControl package) follows Agrachev and Sachkov's
    Chapter 12, with the departures D1-D11 listed in the package's README: in coordinates on an
    open subset of a finite-dimensional space, the chronological calculus read pointwise along
    trajectories; C1 instead of smooth, strong local instead of global minimizers (both
    generalizations); a compact control set; free time with a cost and mixed boundary conditions,
    left to the reader, through one auxiliary system; measurable time changes (the source's
    reparametrization assumes a smooth new time); Lemma 12.1 on any convex cone; one supporting
    covector for all needle variations (the source's proof of Theorem 12.4 takes one for each);
    Brouwer's theorem from the FixedPoint package; and the well-posedness of Caratheodory
    solutions, which the source cites from Gamkrelidze, proved by Picard iteration and Gronwall's
    inequality, with a cut-off near the reference trajectory instead of complete vector fields.
    Three gaps of the source are repaired: the proof of Remark (1) after Lemma 12.1 (any convex
    cone) uses interior points, which a cone may lack; a needle variation placed at the final time
    t1 varies nothing (such times are moved); and the Lipschitz property and derivative of the
    end-point map of the needle variations (p. 172) are stated without proof.

