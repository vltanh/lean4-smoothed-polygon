# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Smoothed polygons in the Reinhardt optimal control problem"
  description: >-
    A Lean 4 formalization of Thomas Hales and Koundinya Vajjha, Packings of Smoothed Polygons
    (arXiv:2405.04331v1, 2024). The book reformulates the Reinhardt problem, which asks for the
    centrally symmetric convex disk whose densest packing is least dense, as an optimal control
    problem on SL2(R), and studies its Pontryagin extremals.


    The book's main theorem, Mahler's First conjecture (Theorem 16.3.1: the global minimizer is
    bang-bang with finitely many switches, and every K_min is a smoothed polygon), is proved with
    no hypothesis (SmoothedPolygons.theorem16_3_1_unconditional; in the Challenge,
    mahler_first_conjecture). Formalized and proved: Chapters 2-8, Sections 9.0-9.1, Chapters
    13-16, Lemma 10.1.1, Appendices A.3, A.6 and A.11, and Corollary A.1.3. Among the results: Theorem 7.5.6, that every
    smoothed (6k+2)-gon is a Pontryagin extremal with bang-bang control; the smoothed octagon's
    packing density (8 - sqrt(32) - ln 2)/(sqrt(8) - 1); the isolation of the octagon among
    extremals (Theorem 7.7.1, up to time translation); the existence of a minimizer, its lift to an
    extremal and its identification with Reinhardt's K_min; Chapter 8's finite bang-bang control
    away from the singular locus; the Fuller system and the stability of its fixed point q_out
    (Chapter 13); the analytic extension of the Reinhardt-Poincare map across the exceptional
    divisor, with its stable and unstable manifolds (Chapter 14); the global basin theorem 16.1.1,
    the cluster point theorem 16.4.1 and Theorem 14.4.1 (no return); and, for the circular control
    set, the conservation of angular momentum along every Pontryagin extremal (Theorem 9.1.6), by
    Sussmann's Noether theorem. Not formalized, by the user's decision: Chapter 1, the rest of
    Chapters 9-12 (apart from Lemma 10.1.1), the other appendices, Appendix B and the remarks that
    no main result uses. Proposition 15.3.2, read off figures and used by no
    proof, is proved in part.


    The book reads four facts off Mathematica computations it did not certify: the containments of
    Table 16.1 and the global unstable curve of Figure 14.2. By the user's decision they are proved
    without computer assistance, by the exact structure of the maps and a few explicit
    inequalities (for the curve, a closed form of the Reinhardt flow along an arc and an explicit
    region that one step of the Poincare map keeps until an arc leaves the star domain). The
    certificates that a computer found (Bernstein coefficients, polynomial cofactors) are checked by
    Lean tactics, with no enumeration of boxes. A
    Python reference in ball arithmetic checks the facts numerically.


    The audit (REPORT.md, 97 findings) records results false as printed and proved in corrected
    form (Lemmas 2.2.1 and 3.1.8, Filippov's theorem, Theorems 7.7.1 and 8.3.1, and the
    Noether-Sussmann theorem as the book quotes it, without the invariance of the cost), the converse of
    the control problem used in Section 6.1 (false; true for winding number one), Theorem 8.2.7
    proved in the authors' reading, swapped labels in Remark 15.3.1, and gaps repaired along the
    book's lines, among them the identification of minimizers with K_min, the convergence and last
    row of Table 16.1, the Reinhardt cells of Section 16.4.2 and the steps that the proof of
    Theorem 14.4.1 does not cite. Every proof follows the book's argument except where the report
    lists a departure, forced by a gap, made where the book only sketches, or, where the book
    computes, made by the user's decision.


    The results the book cites are proved: Fejes Toth's theorem and Mahler's theorems on
    critical lattices in this repository, the Pontryagin maximum principle, Filippov's theorem
    (also under a state constraint) and Sussmann's Noether theorem in the package OptimalControl, Brouwer's fixed-point
    theorem in FixedPoint, and the stable manifold theorem in StableManifold, all by their
    sources' arguments.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.OC", "math.MG"]
