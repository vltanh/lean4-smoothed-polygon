# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Smoothed polygons in the Reinhardt optimal control problem"
  description: >-
    A Lean 4 formalization of the smoothed-polygon core of Thomas Hales and Koundinya Vajjha,
    Packings of Smoothed Polygons (arXiv:2405.04331v1, 2024), with its geometric foundations. The
    book reformulates the Reinhardt problem, which asks for the centrally symmetric convex disk
    whose densest packing is least dense, as an optimal control problem on SL2(R), and studies its
    Pontryagin extremals. Three theorems are conditional: the book's main theorem, Mahler's First
    conjecture (Theorem 16.3.1), is proved only under one named hypothesis,
    NoChatteringIntoSingularLocus, which stands for the book's Theorems 16.4.1 and 14.4.1, not yet
    formalized (they rest on Chapters 13-16, of which Chapters 13 and 15 and Sections 16.1-16.2 are
    formalized); and the global basin theorem (Theorem 16.1.1) and Theorem 16.2.1 are proved only
    under three named numerical facts, DOutContracts, CellTwoEntersDOut and BoxSubclaims, which
    state the containments that the book reads off Mathematica plots and a contraction that its
    argument lacks. Every other result below is proved unconditionally.


    The formalization covers Chapters 2, 3, 4, 6 and 7 of the book with Appendices A.6 and A.11:
    packing and lattice packing densities, critical lattices and circumscribed hexagons, the
    boundary of the minimizer and balanced disks, the state dynamics, the cost and its area
    formula, the upper half-plane model, Filippov's existence theorem, left-invariant control
    systems, the Hamiltonian and the costate equations, constant and bang-bang controls. Its main
    results are Theorem 7.5.6, that for every k >= 1 the smoothed (6k+2)-gon is a Pontryagin
    extremal of the Reinhardt control problem with bang-bang control; that the smoothed octagon is
    a balanced disk of area sqrt(12)(8 - sqrt(32) - ln 2)/(sqrt(8) - 1) whose greatest packing
    density is (8 - sqrt(32) - ln 2)/(sqrt(8) - 1); and Theorem 7.7.1, that the smoothed octagon is
    an isolated extremal, whose proof the book only sketches. The cited results the proofs use are
    proved, among them Fejes Toth's theorem that lattice packings are densest for centrally
    symmetric disks and Mahler's theorems on critical lattices, and so is Filippov's theorem. Four
    results of the book are false as printed and are proved in corrected form: Lemma 2.2.1
    (refuted in Lean), Lemma 3.1.8 and Filippov's theorem (each missing a hypothesis), and Theorem
    7.7.1 (true up to time translation, for terminal times near t_f).


    A fourth round, the first layer of a plan for the book's remaining chapters, proves the claim
    of Section 6.2 that every minimizer of the Reinhardt control problem lifts to a Pontryagin
    extremal, along the book's route, through the Pontryagin maximum principle (free terminal time,
    integral cost, mixed boundary conditions), which the book cites from Agrachev and Sachkov and
    which the package OptimalControl proves by their argument, with Brouwer's fixed-point theorem
    from the package FixedPoint; and Remark 6.6.1, that every extremal extends to a periodic one.


    A fifth round, the second layer, formalizes Chapter 5 (the compactification of the star
    domain: Definition 5.0.1 with the compactness and dihedral invariance of the compact set,
    Theorem 5.0.2, Lemmas 5.0.3-5.0.5, Theorem 5.0.6, whose second case the book only sketches, and
    Lemma 5.0.7) and the argument of Section 6.1 that a global minimizer exists, repaired along the
    book's lines with Filippov's theorem under a closed state constraint, with a compact set of
    initial points and a closed endpoint relation (proved in OptimalControl). Its result is that
    the Reinhardt control problem has a global minimizer, which lifts to a Pontryagin extremal and
    bounds a centrally symmetric convex disk of least greatest packing density (Reinhardt's K_min).
    On the way it shows that the converse of the control problem that Section 6.1 uses, that an
    admissible trajectory bounds a balanced disk whose area is its cost, is false (the unit circle
    traversed seven times is admissible) and holds for trajectories of winding number one, among
    them every trajectory of cost below 7 pi/2; and it proves that the minimizers of the control
    problem correspond to the K_min, which the book uses without proof: the disk bounded by a
    global minimizer is a K_min, and a linear image of every K_min is the disk of a global
    minimizer.


    A sixth round, the third layer, formalizes Chapter 8 (the edge control problem, singular
    subarcs, and finite bang-bang control away from the singular locus) and Corollary A.1.3 of
    Gronwall's inequality: every global minimizer is edge extremal (Proposition 8.1.3), has no
    singular subarc in the authors' reading of Theorem 8.2.7, and is bang-bang with finitely many
    switches on every interval on which its lift avoids the singular locus (Theorem 8.3.2). Theorem
    8.3.1 is false as printed and is proved in a one-sided form, and Theorem 8.2.7, whose proof
    covers only part of its statement, is proved in the authors' reading, both by the user's
    decision; the printed Theorem 8.2.7 is proved for normal lifts and is open for abnormal ones.
    Mahler's First conjecture (Theorem 16.3.1: the global minimizer is bang-bang with finitely many
    switches, and every K_min is a finite-sided smoothed polygon with hyperbolic arcs at its
    corners) is proved conditionally on NoChatteringIntoSingularLocus: the switching times of an
    edge-extremal Pontryagin extremal, with the boundary conditions of the control problem, do not
    accumulate at a time where its lift meets the singular locus. This is the consequence of
    Theorems 16.4.1 (cluster point) and 14.4.1 (no return) that the last step of the book's proof
    uses. The hypothesis is an explicit hypothesis of the theorem, not an axiom; it is not proved,
    so Mahler's First conjecture is not proved here.


    A seventh round, the fourth layer, formalizes Chapter 13, the Fuller system for triangular
    control, the first of the chapters whose results are to discharge that hypothesis (which is
    unchanged): its symmetries (Lemmas 13.2.1-13.2.5), the first control and the first switching
    time (Lemma 13.2.6, Corollary 13.2.7, Lemma 13.2.8), the singular locus (Lemmas 13.3.1 and
    13.3.2), the weighted blow-up of Section 13.4, the Fuller-Poincare map, its two fixed points
    q_out and q_in = tau(q_out) at which the Hamiltonian vanishes, with the scaling factor r_scale
    the unique real root greater than 1 of a palindromic sextic (Lemma 13.5.2, Remark 13.5.3), and
    Lemma 13.5.5: q_out is an asymptotically stable fixed point of the Fuller-Poincare map on the
    zero set of the Hamiltonian, and q_in is unstable. The book proves Lemma 13.5.5 by a
    Mathematica computation of eigenvalues; the formalization computes the Jacobian at q_out
    exactly in Q(sqrt 3, r_scale), certifies that its eigenvalues lie in (-0.1, 0.1) by sign
    changes of its characteristic polynomial at rational points, and proves linearized stability
    for maps, which Mathlib lacks. The proof of Lemma 13.3.2 has a gap (a maximizing face assumed
    constant in time), repaired along the book's lines, and the book's diffeomorphism of Section
    13.4 is only C2 along z2 = 0.


    An eighth round, the fifth layer, formalizes Chapter 15, the geometry of the Fuller-Poincare
    map: the cell coordinates (r2, psi, theta2) on the zero set of the Hamiltonian modulo the
    virial group, used as charts on that quotient; the smaller cells, with the root counts of the
    switching cubics by Descartes's rule of signs; Proposition 15.2.2; the continuity of the first
    switching time and of the cell maps, which the book asserts; the involution tau o F, which is
    an involution only at switching points; and Remark 15.3.1, whose labels q_in and q_out the book
    swaps, proved with the labels corrected and certified in exact rational arithmetic. It also
    formalizes Sections 16.1-16.2: Theorem 16.1.1, that every orbit of the Fuller-Poincare map on
    the zero set of the Hamiltonian modulo the virial group other than the fixed point q_in tends
    to q_out, and Theorem 16.2.1, that the switching points of a Fuller trajectory emanating from
    the singular locus lie on the outward spiral of q_out and those of one tending to it on the
    inward spiral of q_in. Both are proved only conditionally, on three named numerical facts:
    DOutContracts (the Poincare map maps the box D_out = D_00 into itself, and an iterate maps it
    into a box on which the map is a contraction), CellTwoEntersDOut (every point of the second big
    cell reaches D_00 within three steps) and BoxSubclaims (from every other box of the first cell
    but D_22 the map goes to the second cell or to a lexicographically smaller box). They state
    what the book reads off Mathematica plots and figures (Table 16.1, Figures 16.1-16.4), with
    the contraction that its convergence argument lacks; an independent multiple-precision check
    (about 1.1 million evaluations) found them true, with margins of at least 0.015, and a later
    layer (5b) is to certify them by interval enclosures. The book's proof of Theorem 16.1.1 has
    two further gaps, repaired: the convergence in D_out (by the contraction and Banach's fixed
    point theorem) and the last row of its table (by whole-box subclaims and a time-reversal step).
    Proposition 15.3.2, whose topology the book reads off figures, is stated as a named proposition
    and not proved; no result uses it.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.OC", "math.MG"]
  msc2020: ["52C15", "52A10", "49K15"]

sources:
  - title: "Packings of Smoothed Polygons"
    authors:
      - "Thomas Hales"
      - "Koundinya Vajjha"
    id: "arXiv:2405.04331v1"
    type: "book (preprint)"
    location: "https://arxiv.org/abs/2405.04331v1"
    relationship: "formalizes"
    license: "arXiv.org perpetual, non-exclusive license to distribute 1.0"
    author_endorsement: "not-contacted"
  - title: "The Reinhardt Conjecture as an Optimal Control Problem"
    authors:
      - "Thomas C. Hales"
    id: "arXiv:1703.01352"
    type: "preprint"
    location: "https://arxiv.org/abs/1703.01352"
    relationship: "background"
    note: >-
      Earlier preprint that introduced the control-theoretic reformulation and announced that the
      smoothed (6k+2)-gons are Pontryagin extremals with bang-bang control; the book gives the
      full account formalized here.
    author_endorsement: "not-contacted"
  - title: "Über die dichteste gitterförmige Lagerung kongruenter Bereiche in der Ebene und eine besondere Art konvexer Kurven"
    authors:
      - "Karl Reinhardt"
    id: "doi:10.1007/BF02940676"
    type: "article"
    location: "Abh. Math. Sem. Univ. Hamburg 10 (1934) 216-230"
    relationship: "background"
    note: "The smoothed octagon and the Reinhardt problem; not used in the formal proofs."
  - title: "Global aspects of classical integrable systems"
    authors:
      - "Richard H. Cushman"
      - "Larry M. Bates"
    type: "book"
    location: "Birkhäuser, 1997"
    relationship: "background"
    note: >-
      Source of the Euler-Arnold equation cited in the proof of Proposition 6.5.1, proved in the
      formalization for left-invariant Hamiltonians on matrix groups (External.euler_arnold).
  - title: "Control Theory from the Geometric Viewpoint"
    authors:
      - "Andrei A. Agrachev"
      - "Yuri L. Sachkov"
    type: "book"
    location: "Encyclopaedia of Mathematical Sciences 87, Springer, 2004, Theorem 10.1 and Chapter 12"
    relationship: "background"
    note: >-
      The book's reference for the maximum principle (bibliography entry zelikin2004control, which
      names M. I. Zelikin as first author). The maximum principle with free terminal time, an
      integral cost and mixed boundary conditions (Theorem 12.5 with the remark after it) is
      stated in External.pontryagin_maximum_principle and proved in the OptimalControl package by
      Agrachev and Sachkov's argument (Chapter 12, read in the authors' draft with preface dated
      September 2003, from the first author's home page), with the departures D1-D11 that the
      package's README lists; three gaps of the proof are repaired (REPORT.md, Section 7).
      Filippov's theorem, stated in the book as Theorem 6.1.1 without a source and cited from this
      book (Theorem 10.1) by Hales's 2017 preprint, is proved on R^n (External.filippov) by the
      standard argument, written before Agrachev and Sachkov's text was available to us and not
      compared with it; its form with a closed state constraint, a compact set of initial points
      and a closed endpoint relation, which the existence of a minimizer (Section 6.1) applies, is
      proved in the OptimalControl package by the same argument.
  - title: "Analytic proofs of the \"hairy ball theorem\" and the Brouwer fixed point theorem"
    authors:
      - "John Milnor"
    type: "article"
    location: "Amer. Math. Monthly 85 (1978) 521-524"
    relationship: "background"
    note: >-
      Not cited by the book. Brouwer's fixed-point theorem, which Agrachev and Sachkov's proof of
      the maximum principle uses without reference, is proved in the FixedPoint package by the
      analytic argument that this paper and the next are known for; their full texts were not
      available, and the proof was not compared with them line by line.
  - title: "A less strange version of Milnor's proof of Brouwer's fixed-point theorem"
    authors:
      - "C. A. Rogers"
    type: "article"
    location: "Amer. Math. Monthly 87 (1980) 525-527"
    relationship: "background"
    note: "Not cited by the book; see the previous entry."

  - title: "Some packing and covering theorems"
    authors:
      - "László Fejes Tóth"
    type: "article"
    location: "Acta Sci. Math. (Szeged) 12A (1950) 62-67"
    relationship: "background"
    note: >-
      Cited as Theorem 2.1.3 (delta = delta_L for centrally symmetric disks); proved in the
      formalization (External.fejes_toth), through Dowker's theorem and Boroczky's cell lemma.
  - title: "Finite packing and covering"
    authors:
      - "Károly Böröczky Jr."
    type: "book"
    location: "Cambridge University Press, 2004 (and Discrete Comput. Geom. 30 (2003), Lemma 5)"
    relationship: "background"
    note: "Source of the cell lemma used in the proof of Fejes Toth's theorem; not cited by the book."
  - title: "Convex and Discrete Geometry"
    authors:
      - "Peter M. Gruber"
    type: "book"
    location: "Springer, 2007, Corollary 30.1"
    relationship: "background"
    note: "Cited in Definition 2.1.2 (density of a lattice packing); proved (External.gruber_corollary_30_1)."
  - title: "On the minimum determinant and the circumscribed hexagons of a convex domain"
    authors:
      - "Kurt Mahler"
    type: "article"
    location: "Proc. KNAW 50 (1947) 692-703"
    relationship: "background"
    note: >-
      Cited as Theorems 2.3.6 and 2.3.7 and after Definition 2.3.5; Lemma 2 (with Minkowski),
      Theorems 1 and 2 and Lemma 3 are proved (External.minkowski_mahler, External.mahler_1947,
      External.mahler_irreducible_iff, and External.mahler_irreducible, the form Lemma 2.2.5 uses).
      Lemma 3 is stated there without proof; it is proved along the next two sources.
  - title: "On irreducible convex domains"
    authors:
      - "Kurt Mahler"
    type: "article"
    location: "Proc. KNAW 50 (1947) 98-107"
    relationship: "background"
    note: >-
      Not cited by the book; the paper ("paper A") to which Mahler 1947 refers for the proof of
      Lemma 3, read from a scan of Mahler's collected works (CARMA archive, item 094). Its Lemmas 1,
      2, 5-7 and 13 are proved by its arguments (External/MahlerIrreducible.lean,
      External.MahlerIrreducible.ml3_onlyIf), and the Corollary to Lemma 5, which it states without
      proof, is proved; its errors and gaps are repaired (REPORT.md, Section 7).
  - title: "Lattice points in n-dimensional star bodies II. Reducibility theorems I"
    authors:
      - "Kurt Mahler"
    type: "article"
    location: "Proc. KNAW 49 (1946) 331-343"
    relationship: "background"
    note: >-
      The book's entry mahler1946lattice, cited with Minkowski for Theorem 2.3.6, of which it only
      quotes the six-point statement (REPORT.md, E33). Paper A quotes its Lemmas 8, 10, 11 and 12
      from Theorems B-E of this paper, which are proved in the plane by Mahler's arguments
      (External/Mahler1946/TheoremC.lean, External/Mahler1946/TheoremE.lean; scan of Mahler's
      collected works, CARMA archive, item 088), with its errors and gaps repaired: the function G
      in the proof of Theorem C is not even, so it does not define a star body (proved in Lean),
      and two steps of Section 4 are asserted without argument.

related_formalizations:
  - id: "https://github.com/sunfishho/reinhardt-density-bound"
    relationship: "independent"
    note: >-
      Independent, unreviewed Lean 4 development (created 2 November 2026) claiming a lower bound
      for the least packing density and formalizing parts of the book's Chapters 2, 3 and 5. It
      does not formalize Theorem 7.5.6. This work did not consult or use it.
  - id: "https://github.com/vltanh/lean4-optimal-control"
    relationship: "builds-on"
    note: >-
      The package OptimalControl, by the same maintainer, required at the commit pinned in
      lake-manifest.json: control systems with Caratheodory trajectories, Filippov's theorem (also
      with a closed state constraint, a compact set of initial points and a closed endpoint
      relation), measurable selection, and the Pontryagin maximum principle proved by Agrachev and
      Sachkov's argument. External/Filippov.lean and External/Pontryagin.lean state the cited
      results in the book's terms and prove them from it; the existence of a minimizer (Section
      6.1) applies the state-constrained form directly. The Challenge does not import it.
  - id: "https://github.com/vltanh/lean4-fixed-point"
    relationship: "builds-on"
    note: >-
      The package FixedPoint, by the same maintainer, required by OptimalControl: Brouwer's
      fixed-point theorem, by Milnor and Rogers' analytic argument, used in the proof of the
      maximum principle.
  - id: "https://github.com/willcforte/pontryagin-lean"
    relationship: "independent"
    note: >-
      An earlier Lean attempt at the Pontryagin maximum principle (13 May 2026), which states its
      key steps as axioms. This work does not use it.

status:
  scope: >-
    Conditional: Theorem 16.3.1 (Mahler's First conjecture, the book's main theorem) is proved only
    under one named hypothesis, NoChatteringIntoSingularLocus (an explicit hypothesis of
    SmoothedPolygons.theorem16_3_1, not an axiom; the axiom audit lists it among the results the
    theorem uses), which stands for Theorems 16.4.1 and 14.4.1, not yet formalized (they rest on
    Chapters 13-16, of which Chapters 13 and 15 and Sections 16.1-16.2 are formalized): the
    switching times of an edge-extremal
    Pontryagin extremal with the boundary conditions of Problem 3.6.2 do not accumulate at a time
    where its lift meets the singular locus. Also conditional: Theorems 16.1.1 (the global basin of
    the Fuller-Poincare map) and 16.2.1 (outward Fuller trajectories), SmoothedPolygons.theorem16_1_1
    and SmoothedPolygons.theorem16_2_1, are proved only under three named numerical facts,
    SmoothedPolygons.TriFuller.DOutContracts, CellTwoEntersDOut and BoxSubclaims (explicit
    hypotheses of the two theorems, not axioms; the axiom audit lists them among the results the
    theorems use), which stand for the containments of Table 16.1 that the book reads off
    Mathematica plots, with a contraction near q_out that the book's convergence argument lacks;
    they hold numerically and are to be certified by interval enclosures in a later layer.
    Everything else listed here is proved unconditionally.
    Formalized: every numbered result of Chapters 2, 3, 4, 5, 6, 7, 8 and 13 of the book, of
    Chapter 15 except Proposition 15.3.2, and of Appendices A.6 and A.11, and Corollary A.1.3,
    including Theorem 6.1.1 (Filippov, cited without a source),
    Definition 6.3.1 and Proposition 6.4.1 (left-invariant systems on Lie groups), Theorem 5.0.6
    (whose second case the book only sketches) and Theorem 7.7.1 (the smoothed octagon is an
    isolated extremal; the book gives a proof sketch), and Remarks 2.2.4, 7.5.2 and 7.6.4, the
    remark after Definition 2.3.5, the action of the dihedral group on the ideal vertices of
    Section 4.6, and the compactness and dihedral invariance of the compactified star domain
    (Definition 5.0.1). Lemma 2.2.1 is false as printed (refuted in Lean) and is proved in
    corrected form (REPORT.md, E1); Theorem 7.7.1 is false read literally and is proved up to time
    translation, for terminal times near t_f (E32); Lemma 3.1.8 and the existence claim of Theorem
    6.1.1 are proved with a missing hypothesis added (E34, E35); the user approved the four
    corrected statements. Also proved (fourth round, the first layer of a plan for Chapters 5 and
    8-16): the claim of Sections 6.2 and 6.6, used in Proposition 8.1.3, that every global
    minimizer of the Reinhardt control problem lifts to a Pontryagin extremal
    (SmoothedPolygons.exists_isPontryaginExtremal_of_isReinhardtMinimizer), with the boundary
    conditions written without two equations made redundant by first integrals (E21), and Remark
    6.6.1, stated in the book without proof (E38). Also proved (fifth round, the second layer): the
    existence of a global minimizer of the Reinhardt control problem (Section 6.1,
    SmoothedPolygons.exists_isReinhardtMinimizer; the book's argument repaired with Filippov's
    theorem under a closed state constraint, E46), the converse of Problem 3.6.2 for trajectories
    of winding number one (E15; false for higher winding), the identification of the global
    minimizers with Reinhardt's K_min, which the book uses without proof (E47), and their
    combination: a global minimizer exists, lifts to a Pontryagin extremal and bounds a K_min
    (SmoothedPolygons.exists_isReinhardtMinimizer_isPontryaginExtremal_isWorstDisk). Also proved
    (sixth round, the third layer): Chapter 8 and Corollary A.1.3 (stated for t >= 0, with the
    two-sided form that Chapter 8 uses, E61); Proposition 8.1.3, every global minimizer is edge
    extremal (the principle of optimality made precise, E48); Theorem 8.1.4 for every extremal of
    the edge problem (E49); Remark 8.1.6 with the signs of both costates reversed (E51); Lemma 8.2.1
    with the hypothesis <X, Z_u> != 0 on U_T (E52); Theorem 8.2.7 in the authors' reading, the
    user's decision, with the printed statement for normal lifts, open for abnormal lifts (E55);
    Theorem 8.3.1, false as printed, in its one-sided form, the user's decision, with the control
    form that Theorem 8.3.2 quotes as a corollary (E56); Theorem 8.3.2 as Chapter 8 states it (its
    restatement in Chapter 1, without edge extremality, is false, E57); Remark 8.3.3, with the
    balanced disk as a hypothesis (E58); Lemma 8.3.4; and the unconditional part of Theorem 16.3.1,
    that a global minimizer is bang-bang with finitely many switches on every interval on which its
    lift avoids the singular locus
    (SmoothedPolygons.isFiniteBangBang_of_isReinhardtMinimizer_of_not_mem_singularLocus). Also
    proved (seventh round, the fourth layer): Chapter 13, the Fuller system for triangular control,
    with Lemma 13.5.2 (SmoothedPolygons.lemma13_5_2: exactly two fixed points of the
    Fuller-Poincare map at which the Hamiltonian vanishes, q_out and q_in = tau(q_out), with
    certified bounds 6.27 < r_scale < 6.28 and 7.4 < t_sw < 7.41 in place of the book's
    approximations) and Lemma 13.5.5 (SmoothedPolygons.lemma13_5_5: q_out asymptotically stable,
    q_in unstable), whose Mathematica computation is replaced by an exact Jacobian and a certified
    eigenvalue bound (E68); Remark 13.5.3; and the verifiable part of Remark 13.5.4 (E69). Also
    proved (eighth round, the fifth layer): Chapter 15, with Proposition 15.2.2
    (SmoothedPolygons.proposition15_2_2: the cells cover the quotient, with their first controls
    and the vanishing limiting switching times on their faces), the involution tau o F at
    switching points (E73), and Remark 15.3.1 with q_in and q_out swapped back
    (SmoothedPolygons.remark15_3_1, remark15_3_1_segment; r2 = 2 - sqrt 3 exactly, E75); and,
    conditionally, Theorems 16.1.1 and 16.2.1 (above). Not formalized: Chapter 1; Chapters 9-12 and
    14 and Section 16.4, apart from Theorem 16.3.1, proved conditionally; Appendix A.1 apart from
    Corollary A.1.3, Appendices A.2-A.5, A.7-A.10 and B; within the formalized chapters, the
    conjectural Remarks 7.6.1 and 7.6.3, the printed Theorem 8.2.7 for abnormal lifts, which is
    open, the interpretation in Remark 13.5.4 of a fixed point as a limit of the extremals of
    Section 7.5 (Mathematica and a forward reference to Section 14.2), the informal corollary after
    Lemma 13.2.8, which is not used later, Proposition 15.3.2 (stated as a named proposition,
    SmoothedPolygons.TriFuller.Proposition15_3_2, and not used), the two-sides claim of Remark
    15.2.1, the attachment of the 2-cell C2(zeta^2, 1, 1), and the claims of Chapters 15-16 read
    off figures that the proofs do not use (REPORT.md, Section 9). Pontryagin
    extremals are defined by the conditions of the maximum principle (IsPontryaginExtremal), and
    the maximum principle shows that minimizers are extremals. No cited theorem is assumed: Fejes
    Toth's theorem, Gruber's density formula, the theorems of Minkowski and Mahler on critical
    lattices and circumscribed hexagons, Mahler's Lemma 3 on irreducible domains (in full, along the
    two earlier papers of Mahler on which it rests), the Euler-Arnold equation and the Pontryagin
    maximum principle are proved, and so is Filippov's theorem; the last two are stated in External/
    and proved in the OptimalControl package (github.com/vltanh/lean4-optimal-control, at a pinned
    commit), which takes Brouwer's fixed-point theorem from the FixedPoint package
    (github.com/vltanh/lean4-fixed-point); the form of Filippov's theorem with a state constraint
    that Section 6.1 applies is proved in OptimalControl too.
    Statements and definitions corrected (REPORT.md, Section 3): E1 (false lemma), E6, E13 (a
    hypothesis approved by the user), E15 (the converse of Problem 3.6.2, for winding number one),
    E16, E17, E20, E21, E26, E32 (Theorem 7.7.1's reading), E34 and E35 (hypotheses approved by
    the user), E40 and E45 (the fundamental domain of the dihedral group), E51 (signs), E52 (a
    hypothesis), E55 (Theorem 8.2.7 in the authors' reading, the user's decision), E56 (the false
    Theorem 8.3.1 in its one-sided form, the user's decision), E57, E58 (Remark 8.3.3's disk as a
    hypothesis), E65 (the type of z_j in Lemma 13.3.2), E66 (the identification of Section 13.4,
